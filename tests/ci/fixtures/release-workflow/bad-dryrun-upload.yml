permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read
    steps:
      - name: B
        run: echo b
  sign:
    environment: signing
    permissions:
      contents: write
    steps:
      - name: S
        if: ${{ inputs.dry_run }}
        run: |
          gh release create dry-run --draft
      - name: S2
        if: ${{ !inputs.dry_run }}
        env:
          K: ${{ secrets.GH_RELEASE_SIGNING_KEY }}
        run: bash scripts/release-sign.sh
