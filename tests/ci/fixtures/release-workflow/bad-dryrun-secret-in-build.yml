permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read
    steps:
      - name: Dry run setup
        if: ${{ inputs.dry_run }}
        env:
          K: ${{ secrets.GH_RELEASE_SIGNING_KEY }}
        run: echo b
  sign:
    environment: signing
    permissions:
      contents: write
    steps:
      - name: S
        env:
          K: ${{ secrets.GH_RELEASE_SIGNING_KEY }}
        run: bash scripts/release-sign.sh
