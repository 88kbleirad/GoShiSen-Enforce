permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read
    steps:
      - name: B
        run: echo b
  sign:
    environment: signing
    permissions:
      contents: write
    steps:
      - name: S
        if: ${{ !inputs.dry_run }}
        env:
          K: ${{ secrets.GH_RELEASE_SIGNING_KEY }}
        run: bash scripts/release-sign.sh
      - name: R
        run: gh release create "$RELEASE_TAG" --draft
