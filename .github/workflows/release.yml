name: release

# Publishing workflow: runs only on version tags, not on pull
# requests. PRs validate packaging in ci.yml without publishing.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # upload assets to the GitHub Release for this tag

jobs:
  package:
    name: package + verify + publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # upload assets to the GitHub Release for this tag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.0.0
        with:
          go-version: "1.25"
          cache: true
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq openssl
          curl -fsSL -o /tmp/syft_1.30.0_linux_amd64.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.30.0/syft_1.30.0_linux_amd64.tar.gz
          curl -fsSL -o /tmp/syft-checksums.txt \
            https://github.com/anchore/syft/releases/download/v1.30.0/syft_1.30.0_checksums.txt
          grep 'syft_1.30.0_linux_amd64.tar.gz' /tmp/syft-checksums.txt > /tmp/expected.sha
          (cd /tmp && sha256sum -c expected.sha)
          tar xzf /tmp/syft_1.30.0_linux_amd64.tar.gz -C /usr/local/bin syft
      - name: Build archives
        run: make package VERSION=${{ github.ref_name }}
      - name: Verify archives (arch, version, checksums, SBOM)
        run: make verify-package VERSION=${{ github.ref_name }}
      - name: Sign release artifacts with production key
        env:
          RELEASE_SIGN_KEY: ${{ secrets.GH_RELEASE_SIGNING_KEY }}
        run: |
          # Private key material lives only in the ephemeral runner temp dir;
          # scripts/release-sign.sh removes it via trap and fails closed when
          # the secret is missing, mismatched, or verification fails.
          bash scripts/release-sign.sh \
            --dist dist --commit "${{ github.sha }}" --tag "${{ github.ref_name }}" \
            --builder release.yml/package --toolchain "$(go version)"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never auto-publish: attach to an existing release, or create
          # a DRAFT release. A human explicitly publishes. Pushing a tag
          # is the authorization to BUILD and stage artifacts, not to
          # publish a release.
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/goshisen-linux-amd64.tar.gz \
              dist/goshisen-linux-arm64.tar.gz \
              dist/checksums.txt \
              dist/sbom.spdx.json \
              dist/goshisen-linux-amd64.tar.gz.sig \
              dist/goshisen-linux-arm64.tar.gz.sig \
              dist/checksums.txt.sig \
              dist/sbom.spdx.json.sig \
              dist/provenance-index.txt \
              dist/provenance-index.txt.sig \
              dist/public_key.pem \
              --clobber
          else
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "GoShiSen-Enforce $tag" \
              --generate-notes \
              dist/goshisen-linux-amd64.tar.gz \
              dist/goshisen-linux-arm64.tar.gz \
              dist/checksums.txt \
              dist/sbom.spdx.json \
              dist/goshisen-linux-amd64.tar.gz.sig \
              dist/goshisen-linux-arm64.tar.gz.sig \
              dist/checksums.txt.sig \
              dist/sbom.spdx.json.sig \
              dist/provenance-index.txt \
              dist/provenance-index.txt.sig \
              dist/public_key.pem
          fi
