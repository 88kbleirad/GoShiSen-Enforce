name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  # Bounded curl for pinned tool downloads: --max-time plus retries turn a
  # stalled transfer into a failed step instead of a hung gate. An unbounded
  # syft download hung the "sign + verify release artifacts" job for 37m16s in
  # run 45158637759 while the same job passed in 55s on the sibling run.
  CURL_BOUNDED: "--connect-timeout 15 --max-time 300 --retry 3 --retry-delay 5 --retry-all-errors"
  # Bounded apt, same reason: an unbounded `apt-get update` hung the
  # "integration (real netns lab, privileged)" job's "Install netfilter
  # tooling" step on run 45164900572 (50+ min in a ~3 min job).
  APT_BOUNDED: "-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"

jobs:
  build:
    name: build, vet, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Verify the release binary is statically linked
        run: |
          # The release/default build must be static (OpenWrt musl, release
          # archives); fail if it became dynamically linked.
          make build
          make verify-static
          file bin/goshisen
          if ldd bin/goshisen 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "ERROR: bin/goshisen is dynamically linked"; exit 1
          fi
      - name: Smoke test the CLI
        run: |
          go build -o /tmp/goshisen ./cmd/goshisen
          /tmp/goshisen --help >/dev/null
          /tmp/goshisen --version
          # Missing policy_file must fail with a clear error.
          if /tmp/goshisen 2>/dev/null; then
            echo "expected non-zero exit for missing configuration"; exit 1
          fi
      - name: Verify version stamp
        run: |
          # -ldflags -X can only set string variables, not constants; a
          # const Version silently stays "dev". Build with an explicit
          # VERSION and assert the CLI reports it.
          go build -ldflags "-X github.com/88kbleirad/GoShiSen-Enforce/internal/cli.Version=stamp-test" \
            -o /tmp/goshisen-stamped ./cmd/goshisen
          out=$(/tmp/goshisen-stamped --version)
          if [ "$out" != "goshisen stamp-test" ]; then
            echo "version stamp not applied: got $out"; exit 1
          fi

  release-tag-guard:
    # S-003 regression gate: a tag name containing shell metacharacters
    # must be rejected by the release-tag validator BEFORE it can reach
    # any shell command. Runs on every PR so the gate cannot regress.
    name: release-tag-guard (S-003)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Metacharacter tag fixtures must be rejected before use
        run: bash tests/ci/validate-release-tag-test.sh

  release-run:
    # P3.11 regression gate: the release-run wrapper must list every step with
    # its exact commands, validate the tag through the S-003 guard first, and
    # mutate nothing in --dry-run; in --execute it runs only the `agent` steps
    # against scratch fixtures, stops at a gated step, and writes evidence.
    # The plan is the codified v0.2.9 run (issue #142); this pins it so a step
    # or a refusal cannot silently disappear.
    name: release-run (P3.11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dry-run plan, fail-closed arguments, no mutation
        run: bash tests/ci/release-run-test.sh

  release-pretag-gate:
    # F-01 regression gate: the commit being tagged must ALREADY carry a
    # matching openwrt/Makefile (PKG_VERSION == tag version, PKG_RELEASE
    # set). The v0.2.6 tag shipped PKG_VERSION:=0.2.5 and was fixed only
    # by a post-tag pin PR; the fixture harness below pins that case.
    # Runs on every push/PR, and on a tag push it gates the real tag.
    name: release-pretag-gate (F-01)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pre-tag gate fixtures must reject wrong version, missing release and a dirty tree
        run: bash tests/ci/release-pretag-check-test.sh
      - name: Checked-out tree must agree with its own PKG_VERSION
        run: |
          pkg_version="$(sed -nE 's/^PKG_VERSION[[:space:]]*:=?[[:space:]]*(.*)/\1/p' openwrt/Makefile | head -n1)"
          [ -n "$pkg_version" ] || { echo "FAIL: PKG_VERSION not found in openwrt/Makefile" >&2; exit 1; }
          bash scripts/release-pretag-check.sh --tag "v$pkg_version"
      - name: Tagged commit must carry a matching PKG_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/release-pretag-check.sh --tag "$GITHUB_REF_NAME"

  apk-payload-go-gate:
    # S-005 regression gate: the apk payload's embedded Go toolchain
    # must be >= 1.27.4 (the pinned CI/release version) — the released
    # v0.2.5 apk embedded go1.27.1 with 11 reachable stdlib vulns.
    # Runs on every PR so the signing-path gate cannot regress.
    name: apk-payload-go-gate (S-005)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Go toolchain gate fixtures must fail closed
        run: bash tests/ci/check-apk-payload-go-test.sh

  apk-payload-govuln-gate:
    # S-005 regression gate: the apk payload must pass govulncheck
    # binary-mode with an empty (or explicitly reviewed) allowlist.
    # Runs on every PR so the signing-path gate cannot regress.
    name: apk-payload-govuln-gate (S-005)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Install govulncheck (pinned, reviewed)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck gate fixtures must fail closed
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash tests/ci/check-apk-payload-govuln-test.sh

  cli-archive-govuln-gate:
    # S-005 regression gate: the CLI/daemon release archives must pass
    # govulncheck binary-mode with an empty (or explicitly reviewed)
    # allowlist. release.yml runs the gate on the real archives before
    # signing; this job keeps the gate, its fixtures and the clean-stream
    # shape assertion from regressing.
    name: cli-archive-govuln-gate (S-005)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Install govulncheck (pinned, reviewed)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck CLI-archive gate fixtures must fail closed
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash tests/ci/check-cli-archive-govuln-test.sh

  check-backup-key:
    # F-02 (issue #100): the offline check the maintainer runs on a personal
    # machine before re-setting GH_RELEASE_SIGNING_KEY must keep working and
    # must never print key material (tests use scratch keypairs only).
    name: check-backup-key (F-02)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Local backup-key check fixtures
        run: bash tests/ci/check-backup-key-test.sh

  release-workflow-guard:
    # F-02 (issue #100) regression gate: the CLI signing key
    # (secrets.GH_RELEASE_SIGNING_KEY) may be used only by release.yml's
    # `sign` job, and that job must declare `environment: signing` — the
    # approval gate IS the environment (required reviewer), so the guard
    # fails a `sign` job that lost it (the #125 regression) as well as any
    # other job/workflow that references the key. `build` stays
    # secret-free with contents: read. The structural checker + its
    # per-rule negative fixtures live in
    # scripts/check-release-workflow-structure.py and
    # tests/ci/release-workflow-guard-test.sh (which also executes the
    # real fail-closed step bodies: dry-run ref guard, asset checksum
    # gate, trust-anchor fingerprint gate, dry-run key handling).
    name: release-workflow-guard (F-02)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release workflow must keep the CLI key scoped to the sign job
        run: bash tests/ci/release-workflow-guard-test.sh

  apk-build-manifest-gate:
    # The apk build manifest (scripts/build-apk-release.sh) must describe a
    # build that the COMMITTED recipe can produce: recipe + overlay hashes
    # equal the committed files at the recorded commit, replaying them
    # reproduces the recorded Makefile hash, the Go version/toolchain hashes
    # satisfy packaging/go-toolchain.env, the SDK digest equals apk-sign.yml's
    # pin, and the artifact hashes match the files. Fixtures only.
    #
    # Why CI does not build the apk itself: the build needs the 3.18 GB
    # digest-pinned OpenWrt SDK image, a network clone of every pinned feed
    # plus the package source, ~5 GB of scratch space and 10-30 min per build
    # (twice for A/B), and the smoke test needs privileged QEMU. That is a
    # release-host step (scripts/build-apk-release.sh); CI runs the fixtures
    # here and the payload gates (apk-payload-go-gate / apk-payload-govuln-gate)
    # on any apk artifact, so a recipe/manifest regression still fails on the PR.
    name: apk-build-manifest-gate (F-01)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checker requires the Makefile's PKG_SOURCE_VERSION pin to be a
          # commit in the checkout, so actions/checkout's default depth of 1
          # fails the fixtures with
          # "FAIL: pkg.source_version <sha> is not a commit in <repo>";
          # reproduced with `git clone --depth 1` (one-commit history).
          fetch-depth: 0
      - name: Install jq and patch(1) (fixtures mutate JSON, replay with patch)
        # The fixtures generator replays the recipe with patch(1)+sed(1) on
        # purpose (not the checker's git apply+python), so the test's first
        # check is for patch(1) and it exits 1 without it. The ubuntu-24.04
        # runner image ships none: `patch` is absent from its published apt
        # package list between `parallel` and `patchelf`, and the base
        # ubuntu:24.04 image has none either. `patch` is in noble `main`
        # (2.7.6-7build3), so no extra apt source is needed. jq is preinstalled
        # on the runner but is installed explicitly so its version cannot
        # drift silently.
        run: |
          sudo apt-get $APT_BOUNDED update
          sudo apt-get $APT_BOUNDED install -y --no-install-recommends jq patch
      - name: Build-manifest fixtures must fail closed for the right reason
        run: bash tests/ci/apk-build-manifest-test.sh

  arm64:
    name: arm64 cross-build + static ELF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Cross-compile arm64 + static ELF assertions
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -o /tmp/goshisen-arm64 ./cmd/goshisen
          file /tmp/goshisen-arm64 | tee /tmp/goshisen-arm64.file
          grep -q "aarch64" /tmp/goshisen-arm64.file
          grep -qE "statically linked|static" /tmp/goshisen-arm64.file
      - name: arm64 regression tests
        run: go test ./tests/package/ -run 'TestArm64' -v
      - name: Smoke under qemu-user (when binfmt available)
        run: |
          if command -v qemu-aarch64-static >/dev/null 2>&1; then
            qemu-aarch64-static /tmp/goshisen-arm64 --version
            qemu-aarch64-static /tmp/goshisen-arm64 offload status
          else
            echo "qemu-aarch64-static not present; static-ELF assertions covered"
          fi

  robustness:
    name: CLI anomaly sweep + config fuzz + lint gates
    runs-on: ubuntu-24.04
    # Bounded: `go install` of the pinned scanners is a network step.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: CLI anomaly sweep (257 cases, must be all-clean)
        run: python3 scripts/cli-anomaly-sweep.py
      - name: Fuzz config layer (30s each target)
        run: |
          for f in FuzzConfigQueueRanges FuzzConfigPorts FuzzConfigMisc; do
            go test ./internal/config/ -fuzz="^$f$" -fuzztime=30s -run '^$'
          done
      - name: Install staticcheck (pinned, reviewed)
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: Staticcheck (must be empty baseline)
        run: $(go env GOPATH)/bin/staticcheck ./...
      - name: Install govulncheck (pinned, reviewed)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck source mode (warn-only on PRs, D2)
        # D2 policy: dependency CVEs are advisory on PRs (annotation, no
        # failure - a PR must not be blocked by a CVE in a dependency it
        # did not choose) and BLOCKING in the release paths:
        #   * release.yml  -> S-005 binary-mode gates on the CLI archives
        #   * apk signing  -> check-apk-payload-govuln.sh / release-pin-gate
        #   * .github/workflows/security-weekly.yml -> scheduled report
        run: |
          set -o pipefail
          out="$(mktemp)"
          if $(go env GOPATH)/bin/govulncheck -mode=source ./... >"$out" 2>&1; then
            echo "govulncheck: no findings"
            exit 0
          fi
          echo "::warning::govulncheck reported findings (advisory on PRs; the release gates block)"
          {
            echo "### govulncheck (source mode) findings"
            echo ""
            echo '```'
            tail -n 60 "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sed -n 's/^/govulncheck: /p' "$out" | tail -n 40
          exit 0

  package:
    name: package + verify release archives
    runs-on: ubuntu-24.04
    # Bounded: the job downloads syft; a stalled transfer must fail the job.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Install packaging tools
        run: |
          sudo apt-get $APT_BOUNDED update
          sudo apt-get $APT_BOUNDED install -y --no-install-recommends jq
          # syft pinned to a reviewed immutable version; verify its
          # published checksum before use.
          curl $CURL_BOUNDED -fsSL -o /tmp/syft_1.30.0_linux_amd64.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.30.0/syft_1.30.0_linux_amd64.tar.gz
          curl $CURL_BOUNDED -fsSL -o /tmp/syft-checksums.txt \
            https://github.com/anchore/syft/releases/download/v1.30.0/syft_1.30.0_checksums.txt
          grep 'syft_1.30.0_linux_amd64.tar.gz' /tmp/syft-checksums.txt > /tmp/expected.sha
          (cd /tmp && sha256sum -c expected.sha)
          tar xzf /tmp/syft_1.30.0_linux_amd64.tar.gz -C /usr/local/bin syft
      - name: Build archives
        run: make package VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
      - name: Verify archives (arch, version, checksums, SBOM)
        run: make verify-package VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
      - name: Verify reproducibility (rebuild must be byte-identical)
        run: |
          cp dist/goshisen-linux-amd64.tar.gz /tmp/amd64-first.tar.gz
          make package VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev) >/dev/null
          cmp /tmp/amd64-first.tar.gz dist/goshisen-linux-amd64.tar.gz
      - name: Upload package artifacts (PR validation, never published)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goshisen-release-archives
          path: |
            dist/goshisen-linux-*.tar.gz
            dist/checksums.txt
            dist/sbom.spdx.json

  verify-signatures:
    name: sign + verify release artifacts (test key, fail-closed)
    runs-on: ubuntu-24.04
    # Bounded: the job downloads syft and generates keys; a stalled transfer or
    # a hung openssl must fail the job instead of blocking the PR (run
    # 45158637759 hung here for 37m16s).
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Install packaging tools (syft pinned)
        run: |
          sudo apt-get $APT_BOUNDED update
          sudo apt-get $APT_BOUNDED install -y --no-install-recommends jq openssl
          curl $CURL_BOUNDED -fsSL -o /tmp/syft_1.30.0_linux_amd64.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.30.0/syft_1.30.0_linux_amd64.tar.gz
          curl $CURL_BOUNDED -fsSL -o /tmp/syft-checksums.txt \
            https://github.com/anchore/syft/releases/download/v1.30.0/syft_1.30.0_checksums.txt
          grep 'syft_1.30.0_linux_amd64.tar.gz' /tmp/syft-checksums.txt > /tmp/expected.sha
          (cd /tmp && sha256sum -c expected.sha)
          tar xzf /tmp/syft_1.30.0_linux_amd64.tar.gz -C /usr/local/bin syft
      - name: Build archives
        run: make package VERSION=0.2.1-sigtest
      - name: Sign with a throwaway test key
        run: |
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/k.pem"
          openssl pkey -in "$RUNNER_TEMP/k.pem" -pubout -out "$RUNNER_TEMP/k.pub.pem"
          bash scripts/sign-artifacts.sh \
            --dist dist --key "$RUNNER_TEMP/k.pem" --public-key "$RUNNER_TEMP/k.pub.pem" \
            --commit "${{ github.sha }}" --tag 0.2.1-sigtest \
            --builder ci --toolchain "1.25" --sign
          bash scripts/verify-signatures.sh \
            --dist dist --public-key "$RUNNER_TEMP/k.pub.pem" \
            --commit "${{ github.sha }}" --require-sign
      - name: Tamper must fail (fail-closed proof)
        run: |
          set +e
          mkdir -p /tmp/dist2
          cp -r dist/. /tmp/dist2/
          echo tampered >> /tmp/dist2/goshisen-linux-amd64.tar.gz
          bash scripts/verify-signatures.sh --dist /tmp/dist2 \
            --public-key "$RUNNER_TEMP/k.pub.pem" \
            --commit "${{ github.sha }}" --require-sign \
            > /tmp/verify-tamper.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: tampered artifact verified cleanly" >&2
            cat /tmp/verify-tamper.log >&2
            exit 1
          fi
          grep -q "bad-signature" /tmp/verify-tamper.log || {
            echo "FAIL: expected bad-signature error, got:" >&2
            cat /tmp/verify-tamper.log >&2
            exit 1
          }
          echo "OK: tampered artifact rejected (rc=$rc)"

  openwrt-integration:
    name: openwrt e2e (QEMU lab, privileged)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Install lab tooling
        run: |
          sudo apt-get $APT_BOUNDED update
          sudo apt-get $APT_BOUNDED install -y --no-install-recommends \
            iproute2 nftables procps kmod curl wget python3 qemu-system-x86 \
            iptables e2fsprogs
      - name: Build static daemon for the image
        run: |
          CGO_ENABLED=0 go build \
            -ldflags "-s -w \
              -X github.com/88kbleirad/GoShiSen-Enforce/internal/cli.Version=0.2.0-openwrt \
              -X github.com/88kbleirad/GoShiSen-Enforce/internal/app.Version=0.2.0-openwrt" \
            -o /tmp/goshisen-static ./cmd/goshisen
          file /tmp/goshisen-static | grep -q statically || { echo "not static"; exit 1; }
      - name: Real preflight gate (same PATH as the runner)
        run: |
          # The real preflight must reach READY on this fully provisioned
          # runner (same PATH the runner will use). This is the separate
          # integration target: it never substitutes a fixture.
          sudo -E env "PATH=$PATH" go test -tags preflight_integration \
            ./tests/integration/ -run '^TestPreflightReal$' \
            -v -count=1
      - name: Run the reproducible e2e runner (preflight + manifest + e2e + teardown)
        run: |
          E2E_ARTIFACT_DIR=/tmp/e2e-artifacts \
          E2E_DAEMON=/tmp/goshisen-static \
            sudo -E env "PATH=$PATH" bash scripts/e2e-runner.sh \
            --artifacts /tmp/e2e-artifacts
        timeout-minutes: 35
      - name: Upload e2e artifacts (manifest/diagnostics/logs)
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: /tmp/e2e-artifacts/**
          if-no-files-found: warn

  openwrt-integration-v6:
    name: openwrt e2e v6 stateful (QEMU lab, privileged)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Install lab tooling
        run: |
          sudo apt-get $APT_BOUNDED update
          sudo apt-get $APT_BOUNDED install -y --no-install-recommends \
            iproute2 nftables procps kmod curl wget python3 qemu-system-x86 \
            iptables e2fsprogs
      - name: Record CI kernel version
        run: |
          echo "runner kernel: $(uname -r)"
          uname -r > /tmp/ci-kernel.txt
      - name: Build static daemon for the image
        run: |
          CGO_ENABLED=0 go build \
            -ldflags "-s -w \
              -X github.com/88kbleirad/GoShiSen-Enforce/internal/cli.Version=0.2.0-openwrt \
              -X github.com/88kbleirad/GoShiSen-Enforce/internal/app.Version=0.2.0-openwrt" \
            -o /tmp/goshisen-static ./cmd/goshisen
          file /tmp/goshisen-static | grep -q statically || { echo "not static"; exit 1; }
      - name: Real preflight gate (same PATH as the runner)
        run: |
          sudo -E env "PATH=$PATH" go test -tags preflight_integration \
            ./tests/integration/ -run '^TestPreflightReal$' \
            -v -count=1
      - name: Run the reproducible e2e runner (v6 dual-tap, stateful)
        run: |
          E2E_ARTIFACT_DIR=/tmp/e2e-artifacts-v6 \
          E2E_DAEMON=/tmp/goshisen-static \
          E2E_LAB_MODE=v6 \
            sudo -E env "PATH=$PATH" bash scripts/e2e-runner.sh \
            --artifacts /tmp/e2e-artifacts-v6
        timeout-minutes: 40
      - name: Upload e2e artifacts (manifest/diagnostics/logs)
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-v6-artifacts
          path: /tmp/e2e-artifacts-v6/**
          if-no-files-found: warn

  integration:
    name: integration (real netns lab, privileged)
    runs-on: ubuntu-24.04
    # Bounded: apt-get plus the netns lab; a stalled mirror must fail the job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Install netfilter tooling
        run: |
          sudo apt-get $APT_BOUNDED update
          sudo apt-get $APT_BOUNDED install -y --no-install-recommends nftables iproute2 procps kmod
      - name: Kernel / capability preflight
        run: |
          set -e
          uname -r
          echo "== kernel config =="
          grep -E "CONFIG_NETFILTER_NETLINK_QUEUE|CONFIG_NFT_QUEUE|CONFIG_NF_CONNTRACK|CONFIG_NFT_CT|CONFIG_NF_TABLES|CONFIG_NET_NS" /boot/config-$(uname -r) || true
          echo "== load modules =="
          sudo modprobe nfnetlink_queue
          sudo modprobe nf_conntrack
          sudo modprobe nf_conntrack_netlink
          echo "== NFQUEUE queue-rule probe (netns) =="
          NS=gsh_ci_probe_$$
          sudo ip netns add $NS
          trap 'sudo ip netns del $NS 2>/dev/null || true' EXIT
          printf 'table ip gsh_ci {\n  chain c {\n    type filter hook forward priority 0; policy accept;\n    meta l4proto { tcp, udp } queue num 0\n  }\n}\n' | \
            sudo ip netns exec $NS nft -f -
          echo "queue rule installed OK"
          echo "== conntrack count =="
          sudo cat /proc/sys/net/netfilter/nf_conntrack_count
          echo "NFQUEUE/conntrack preflight OK"
      - name: Run privileged integration tests (must not skip)
        run: |
          # Stream output live so failures always carry diagnostics.
          # Explicit -timeout so a hung test fails with a panic stack
          # instead of the go command's default 10m timeout.
          sudo -E env "PATH=$PATH" go test ./tests/integration/ -v -count=1 -timeout 25m 2>&1 | tee /tmp/integ.log
          rc=${PIPESTATUS[0]}
          if grep -q -- '--- SKIP' /tmp/integ.log; then
            echo "ERROR: privileged integration tests skipped; release gate cannot pass"
            exit 1
          fi
          exit $rc
        timeout-minutes: 30
