name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.0.0
        with:
          go-version: "1.25"
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Smoke test the CLI
        run: |
          go build -o /tmp/goshisen ./cmd/goshisen
          /tmp/goshisen --help >/dev/null
          /tmp/goshisen --version
          # Missing policy_file must fail with a clear error.
          if /tmp/goshisen 2>/dev/null; then
            echo "expected non-zero exit for missing configuration"; exit 1
          fi
      - name: Verify version stamp
        run: |
          # -ldflags -X can only set string variables, not constants; a
          # const Version silently stays "dev". Build with an explicit
          # VERSION and assert the CLI reports it.
          go build -ldflags "-X github.com/88kbleirad/GoShiSen-Enforce/internal/cli.Version=stamp-test" \
            -o /tmp/goshisen-stamped ./cmd/goshisen
          out=$(/tmp/goshisen-stamped --version)
          if [ "$out" != "goshisen stamp-test" ]; then
            echo "version stamp not applied: got $out"; exit 1
          fi

  package:
    name: package + verify release archives
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.0.0
        with:
          go-version: "1.25"
          cache: true
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq
          # syft pinned to a reviewed immutable version; verify its
          # published checksum before use.
          curl -fsSL -o /tmp/syft_1.30.0_linux_amd64.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.30.0/syft_1.30.0_linux_amd64.tar.gz
          curl -fsSL -o /tmp/syft-checksums.txt \
            https://github.com/anchore/syft/releases/download/v1.30.0/syft_1.30.0_checksums.txt
          grep 'syft_1.30.0_linux_amd64.tar.gz' /tmp/syft-checksums.txt > /tmp/expected.sha
          (cd /tmp && sha256sum -c expected.sha)
          tar xzf /tmp/syft_1.30.0_linux_amd64.tar.gz -C /usr/local/bin syft
      - name: Build archives
        run: make package VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
      - name: Verify archives (arch, version, checksums, SBOM)
        run: make verify-package VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
      - name: Verify reproducibility (rebuild must be byte-identical)
        run: |
          cp dist/goshisen-linux-amd64.tar.gz /tmp/amd64-first.tar.gz
          make package VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev) >/dev/null
          cmp /tmp/amd64-first.tar.gz dist/goshisen-linux-amd64.tar.gz
      - name: Upload package artifacts (PR validation, never published)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goshisen-release-archives
          path: |
            dist/goshisen-linux-*.tar.gz
            dist/checksums.txt
            dist/sbom.spdx.json

  integration:
    name: integration (real netns lab, privileged)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.0.0
        with:
          go-version: "1.25"
          cache: true
      - name: Install netfilter tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2 procps kmod
      - name: Kernel / capability preflight
        run: |
          set -e
          uname -r
          echo "== kernel config =="
          grep -E "CONFIG_NETFILTER_NETLINK_QUEUE|CONFIG_NFT_QUEUE|CONFIG_NF_CONNTRACK|CONFIG_NFT_CT|CONFIG_NF_TABLES|CONFIG_NET_NS" /boot/config-$(uname -r) || true
          echo "== load modules =="
          sudo modprobe nfnetlink_queue
          sudo modprobe nf_conntrack
          sudo modprobe nf_conntrack_netlink
          echo "== NFQUEUE queue-rule probe (netns) =="
          NS=gsh_ci_probe_$$
          sudo ip netns add $NS
          trap 'sudo ip netns del $NS 2>/dev/null || true' EXIT
          printf 'table ip gsh_ci {\n  chain c {\n    type filter hook forward priority 0; policy accept;\n    meta l4proto { tcp, udp } queue num 0\n  }\n}\n' | \
            sudo ip netns exec $NS nft -f -
          echo "queue rule installed OK"
          echo "== conntrack count =="
          sudo cat /proc/sys/net/netfilter/nf_conntrack_count
          echo "NFQUEUE/conntrack preflight OK"
      - name: Run privileged integration tests (must not skip)
        run: |
          # Stream output live so failures always carry diagnostics.
          # Explicit -timeout so a hung test fails with a panic stack
          # instead of the go command's default 10m timeout.
          sudo -E env "PATH=$PATH" go test ./tests/integration/ -v -count=1 -timeout 25m 2>&1 | tee /tmp/integ.log
          rc=${PIPESTATUS[0]}
          if grep -q -- '--- SKIP' /tmp/integ.log; then
            echo "ERROR: privileged integration tests skipped; release gate cannot pass"
            exit 1
          fi
          exit $rc
        timeout-minutes: 30
